# Server
server.port=8080

# MongoDB Connection
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=arikalp_db

# Optional: full URI format (use this OR the above, not both)
# spring.data.mongodb.uri=mongodb://localhost:27017/arikalp_db

# Show MongoDB queries in logs (useful during development)
logging.level.org.springframework.data.mongodb=DEBUG
